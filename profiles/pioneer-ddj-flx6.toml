# Pioneer DJ DDJ-FLX6: what each control sends.
#
# Written from AlphaTheta's "DDJ-FLX6 List of MIDI messages" (2020).
# "Fig. 1-1L" etc.
# in the comments are that document's figure numbers. The Mixxx mapping for
# this controller was read only as a cross-check; where it differs from the
# document, the document is followed. Not yet checked on a controller.
#
# How the controller uses MIDI channels (from the document):
# - channels 1-4: the deck controls of decks 1-4. The DECK 1/3 and DECK
#   2/4 buttons switch which deck a side controls; the controller then
#   sends on that deck's channel. Channels 1-4 are also the four mixer
#   channels (fixed).
# - channels 5-6: Beat FX (FX1, FX2 slot groups) and MERGE FX left/right.
# - channel 7: browser, LOAD, crossfader, master / booth / headphone
#   levels, the four FILTER knobs.
# - channels 8, 10, 12, 14: the pads of decks 1-4; 9, 11, 13, 15 the same
#   with SHIFT. Every pad mode sends its own notes (HOT CUE 0x00-0x07,
#   PAD FX 0x10-, BEAT JUMP 0x20-, SAMPLER 0x30-, KEYBOARD 0x40-,
#   KEY SHIFT 0x50-, BEAT LOOP 0x60-, SAMPLE SCRATCH 0x70-).
# Knobs and faders are 14-bit (MSB, LSB). Jogs are relative, centred on 64.
#
# See crates/dj-midi/src/profile.rs for the format.

name = "Pioneer DJ DDJ-FLX6"
port = "DDJ-FLX6"
lights = "ddj-flx6"

[jog]
# Not in the document. 7200 is what the Mixxx mapping for this controller
# uses (its author had one). To be measured.
ticks_per_turn = 7200

# ----- browser, load (channel 7) ------------------------------------------------

[[control]]
name = "browse"             # Fig. 4-1: 1 = one click clockwise, 127 = one anticlockwise
cc = 0x40
kind = "relative"
channel = "7"

[[control]]
name = "browse_shift"       # Fig. 4-1, SHIFT
cc = 0x64
kind = "relative"
channel = "7"

[[control]]
name = "browse_push"        # Fig. 4-1
note = 0x41
channel = "7"

[[control]]
name = "browse_shift_push"  # Fig. 4-1, SHIFT
note = 0x42
channel = "7"

[[control]]
name = "browse_back"        # Fig. 4-2 BACK
note = 0x65
channel = "7"

[[control]]
name = "load"               # Fig. 4-4 to 4-7: LOAD (Deck1) 0x46 ... (Deck4) 0x49
notes = [0x46, 0x49]        # index = deck
channel = "7"

[[control]]
name = "eject"              # Fig. 4-4 SHIFT + LOAD (Deck1)
note = 0x58
channel = "7"
index = 0

[[control]]
name = "eject"              # Fig. 4-5 SHIFT + LOAD (Deck2)
note = 0x59
channel = "7"
index = 1

[[control]]
name = "eject"              # Fig. 4-6 SHIFT + LOAD (Deck3)
note = 0x60
channel = "7"
index = 2

[[control]]
name = "eject"              # Fig. 4-7 SHIFT + LOAD (Deck4)
note = 0x61
channel = "7"
index = 3

# ----- master section (channel 7) -----------------------------------------------

[[control]]
name = "crossfader"         # Fig. 3-10: 0 = fully left
cc14 = [0x1F, 0x3F]
channel = "7"

[[control]]
name = "master_level"       # Fig. 3-2
cc14 = [0x08, 0x28]
channel = "7"

[[control]]
name = "booth_level"        # Fig. 3-4
cc14 = [0x09, 0x29]
channel = "7"

[[control]]
name = "cue_gain"           # Fig. 3-12 HEADPHONE LEVEL
cc14 = [0x0D, 0x2D]
channel = "7"

[[control]]
name = "cue_mix"            # Fig. 3-13 HEADPHONE MIX
cc14 = [0x0C, 0x2C]
channel = "7"

[[control]]
name = "filter"             # Fig. 3-7 FILTER (CH1)
cc14 = [0x17, 0x37]
channel = "7"
unit = "strip"
number = 1

[[control]]
name = "filter"             # Fig. 3-7 FILTER (CH2)
cc14 = [0x18, 0x38]
channel = "7"
unit = "strip"
number = 2

[[control]]
name = "filter"             # Fig. 3-7 FILTER (CH3)
cc14 = [0x19, 0x39]
channel = "7"
unit = "strip"
number = 3

[[control]]
name = "filter"             # Fig. 3-7 FILTER (CH4)
cc14 = [0x1A, 0x3A]
channel = "7"
unit = "strip"
number = 4

# ----- mixer channels (channels 1-4) ---------------------------------------------

[[control]]
name = "level"              # Fig. 3-5 TRIM
cc14 = [0x04, 0x24]
channel = "strip"

[[control]]
name = "eq_high"            # Fig. 3-6 EQ Hi
cc14 = [0x07, 0x27]
channel = "strip"

[[control]]
name = "eq_mid"             # Fig. 3-6 EQ Mid
cc14 = [0x0B, 0x2B]
channel = "strip"

[[control]]
name = "eq_low"             # Fig. 3-6 EQ Low
cc14 = [0x0F, 0x2F]
channel = "strip"

[[control]]
name = "channel_fader"      # Fig. 3-9 CH FADER
cc14 = [0x13, 0x33]
channel = "strip"

[[control]]
name = "headphone_cue"      # Fig. 3-8 CH CUE (note-on per press)
note = 0x54
channel = "strip"

# ----- decks (channels 1-4) ------------------------------------------------------

[[control]]
name = "shift"              # Fig. 1-3: on the channel of the deck the side controls
note = 0x3F
channel = "deck"

[[control]]
name = "layer"              # Fig. 1-5 DECK: note-on (0x7F) on the deck now controlled,
note = 0x3C                 # 0x00 on the other one
channel = "deck"

[[control]]
name = "play"               # Fig. 1-1
note = 0x0B
channel = "deck"

[[control]]
name = "play_shift"         # Fig. 1-1, SHIFT
note = 0x47
channel = "deck"

[[control]]
name = "cue"                # Fig. 1-2
note = 0x0C
channel = "deck"

[[control]]
name = "cue_shift"          # Fig. 1-2, SHIFT
note = 0x48
channel = "deck"

[[control]]
name = "sync"               # Fig. 1-15 BEAT SYNC
note = 0x58
channel = "deck"

[[control]]
name = "sync_shift"         # Fig. 1-15, SHIFT
note = 0x5D
channel = "deck"

[[control]]
name = "master"             # Fig. 1-16 MASTER
note = 0x5C
channel = "deck"

[[control]]
name = "master_shift"       # Fig. 1-16, SHIFT
note = 0x60
channel = "deck"

[[control]]
name = "pitch"              # Fig. 1-17 TEMPO (direction to be checked)
cc14 = [0x00, 0x20]
channel = "deck"
pickup = true

[[control]]
name = "pitch"              # Fig. 1-17, SHIFT + TEMPO
cc14 = [0x05, 0x25]
channel = "deck"
pickup = true

[[control]]
name = "jog_touch"          # Fig. 1-4: platter touched (0x7F) / released
note = 0x36
channel = "deck"

[[control]]
name = "jog_touch_shift"    # Fig. 1-4, SHIFT + touch
note = 0x67
channel = "deck"

[[control]]
name = "jog"                # Fig. 1-4 platter, vinyl mode on
cc = 0x22
kind = "relative-offset"
channel = "deck"

[[control]]
name = "jog"                # Fig. 1-4 platter, vinyl mode off
cc = 0x23
kind = "relative-offset"
channel = "deck"

[[control]]
name = "jog_shift"          # Fig. 1-4 platter, SHIFT
cc = 0x29
kind = "relative-offset"
channel = "deck"

[[control]]
name = "jog_side"           # Fig. 1-4 wheel side
cc = 0x21
kind = "relative-offset"
channel = "deck"

[[control]]
name = "jog_shift"          # Fig. 1-4 wheel side, SHIFT
cc = 0x26
kind = "relative-offset"
channel = "deck"

[[control]]
name = "loop_in"            # Fig. 1-7 IN/-4BEAT, press
note = 0x10
channel = "deck"

[[control]]
name = "loop_4_beats"       # Fig. 1-7 IN/-4BEAT, long press (sent after 0x10)
note = 0x14
channel = "deck"

[[control]]
name = "loop_out"           # Fig. 1-8 OUT
note = 0x11
channel = "deck"

[[control]]
name = "reloop_exit"        # Fig. 1-9 RELOOP/EXIT
note = 0x4D
channel = "deck"

[[control]]
name = "loop_halve"         # Fig. 1-10 CUE/LOOP CALL left
note = 0x51
channel = "deck"

[[control]]
name = "loop_double"        # Fig. 1-11 CUE/LOOP CALL right
note = 0x53
channel = "deck"

[[control]]
name = "beat_jump_back"     # Fig. 1-10, SHIFT
note = 0x61
channel = "deck"

[[control]]
name = "beat_jump_forward"  # Fig. 1-11, SHIFT
note = 0x62
channel = "deck"

# Pad mode buttons (Fig. 5-1 to 5-4; with SHIFT the second mode).
[[control]]
name = "mode_hot_cue"
note = 0x1B
channel = "deck"

[[control]]
name = "mode_keyboard"
note = 0x69
channel = "deck"

[[control]]
name = "mode_pad_fx"
note = 0x1E
channel = "deck"

[[control]]
name = "mode_key_shift"
note = 0x6B
channel = "deck"

[[control]]
name = "mode_beat_jump"
note = 0x20
channel = "deck"

[[control]]
name = "mode_beat_loop"
note = 0x6D
channel = "deck"

[[control]]
name = "mode_sampler"
note = 0x22
channel = "deck"

[[control]]
name = "mode_sample_scratch"
note = 0x6F
channel = "deck"

# ----- pads (Fig. 5-5: decks 1-4 on channels 8, 10, 12, 14; SHIFT 9, 11, 13, 15) --

[[control]]
name = "pad_hot_cue"
notes = [0x00, 0x07]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_hot_cue_shift"
notes = [0x00, 0x07]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_fx"
notes = [0x10, 0x17]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_fx_shift"
notes = [0x10, 0x17]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_beat_jump"
notes = [0x20, 0x27]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_beat_jump_shift"
notes = [0x20, 0x27]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_sampler"
notes = [0x30, 0x37]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_sampler_shift"
notes = [0x30, 0x37]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_keyboard"
notes = [0x40, 0x47]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_keyboard_shift"
notes = [0x40, 0x47]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_key_shift"
notes = [0x50, 0x57]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_key_shift_shift"
notes = [0x50, 0x57]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_beat_loop"
notes = [0x60, 0x67]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_beat_loop_shift"
notes = [0x60, 0x67]
channel = [9, 11, 13, 15]
unit = "deck"

[[control]]
name = "pad_sample_scratch"
notes = [0x70, 0x77]
channel = [8, 10, 12, 14]
unit = "deck"

[[control]]
name = "pad_sample_scratch_shift"
notes = [0x70, 0x77]
channel = [9, 11, 13, 15]
unit = "deck"

# ----- Beat FX (channel 5 = FX1 slots, 6 = FX2 slots) ------------------------------

[[control]]
name = "beatfx_select"      # Fig. 2-1 BFX SELECT: the slot now chosen sends 0x7F
notes = [0x70, 0x72]        # (FX1-1..FX1-3 on channel 5, FX2-1..FX2-3 on 6)
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_channel"     # Fig. 2-2 BFX CH SELECT CH1-CH4: 0x7F when chosen
notes = [0x1C, 0x1F]
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_master"      # Fig. 2-2 BFX CH SELECT MASTER
note = 0x14
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_beats_down"  # Fig. 2-3 BEAT left
note = 0x06
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_beats_up"    # Fig. 2-4 BEAT right
note = 0x07
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_level"       # Fig. 2-5 LEVEL/DEPTH with slot 1 chosen
cc14 = [0x02, 0x22]
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_level"       # ... slot 2
cc14 = [0x04, 0x24]
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_level"       # ... slot 3
cc14 = [0x06, 0x26]
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_on"          # Fig. 2-6 BFX ON/OFF (the note of the chosen slot)
notes = [0x47, 0x49]
channel = [5, 6]
unit = "fx"

[[control]]
name = "beatfx_off"         # Fig. 2-6, SHIFT
note = 0x43
channel = [5, 6]
unit = "fx"

# Not used (yet): JOG CUTTER (Fig. 1-6), CUE/LOOP MEMORY (1-12), MERGE FX
# (1-13, 1-14), the SHIFT functions of IN, OUT and RELOOP/EXIT, CH FADER
# and crossfader start (3-9, 3-10), MASTER CUE (3-3), INPUT SELECT (3-1),
# MIC LEVEL (3-14), VIEW (4-3).
